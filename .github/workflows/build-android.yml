name: Build Kasir DBL Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build APK from latest uploaded source
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract latest Kasir DBL source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="KASIR_DBL_source_final_1.2.0.zip"
          test -s "$SOURCE_ZIP" || { echo "::error::Latest source ZIP not found: $SOURCE_ZIP"; exit 1; }
          mkdir source
          unzip -q "$SOURCE_ZIP" -d source
          test -s source/package.json
          test -s source/app.js
          test -s source/index.html
          test -s source/android-native/src/main/java/id/kasmini/pos/PhoneContactsPlugin.java
          test -s source/android-native/src/main/java/id/kasmini/pos/BluetoothSerialPlugin.java
          test -s source/android-branding/mipmap-xxxhdpi/ic_launcher.png
          cp -a source/. .
          echo "Building latest source archive: $SOURCE_ZIP"
          sha256sum "$SOURCE_ZIP"
          grep -q "Sinkronkan Kontak HP" index.html
          grep -q "PhoneContacts" app.js
          grep -q "Bluetooth Classic SPP" FEATURES-IMPLEMENTED.md
          grep -q "Kasir DBL" index.html

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: ''

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install npm dependencies without stale lockfile
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking package manifest"
          node -e "const p=require('./package.json'); console.log(JSON.stringify(p.dependencies||{},null,2)); console.log(JSON.stringify(p.devDependencies||{},null,2))"
          echo "Discarding the uploaded lockfile because it references an unavailable Rollup tarball (4.68.5)."
          rm -f package-lock.json npm-shrinkwrap.json
          npm cache clean --force
          npm install --no-audit --no-fund --package-lock=false --prefer-online --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Build web assets
        run: npm run build

      - name: Verify latest web features are included
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check db.js
          grep -R -q "Kasir DBL" dist
          grep -R -q "Sinkronkan Kontak HP" dist
          grep -R -q "PIN 6 digit" dist
          grep -R -q "Bagikan" dist

      - name: Remove TypeScript Capacitor config and use JSON config
        shell: bash
        run: |
          set -euo pipefail
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.mjs
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "id.kasmini.pos",
            "appName": "Kasir DBL",
            "webDir": "dist",
            "android": { "allowMixedContent": false }
          }
          EOF
          test ! -e capacitor.config.ts

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor plugins and assets
        run: npx cap sync android

      - name: Apply Kasir DBL launcher icons
        shell: bash
        run: |
          set -euo pipefail
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi mipmap-anydpi-v26 drawable-nodpi values; do
            mkdir -p "android/app/src/main/res/$dir"
            cp -a "android-branding/$dir/." "android/app/src/main/res/$dir/"
          done
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Configure Maven repositories and mirrors
        run: python3 android-native/patch_gradle_repositories.py

      - name: Install native Bluetooth and phone contacts plugins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/id/kasmini/pos
          cp android-native/src/main/java/id/kasmini/pos/*.java android/app/src/main/java/id/kasmini/pos/
          python3 android-native/patch_manifest.py
          grep -q 'READ_CONTACTS' android/app/src/main/AndroidManifest.xml
          grep -q 'PhoneContactsPlugin.class' android/app/src/main/java/id/kasmini/pos/MainActivity.java
          grep -q 'BluetoothSerialPlugin.class' android/app/src/main/java/id/kasmini/pos/MainActivity.java

      - name: Build clean debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --stop
          ./gradlew --no-daemon --refresh-dependencies clean assembleDebug --stacktrace

      - name: Verify APK package
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: kasir-dbl-latest-source-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
