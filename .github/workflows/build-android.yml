name: Build Kasir DBL Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Kasir DBL from latest source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Kasir DBL source (latest feature ZIP)
        run: |
          test -f kasir_dbl_source_fitur_lengkap.zip
          unzip -q kasir_dbl_source_fitur_lengkap.zip -d source
          test -f source/kasmini_android/package.json
          cp -a source/kasmini_android/. .
          echo "=== BUILD SOURCE ==="
          cat package.json
          echo "=== SOURCE MARKERS ==="
          grep -q "PIN admin 6 digit" FEATURES-IMPLEMENTED.md
          grep -q "Bluetooth Classic SPP" FEATURES-IMPLEMENTED.md
          grep -q "Kasir DBL" index.html

      - name: Set app identity
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "id.kasmini.pos",
            "appName": "Kasir DBL",
            "webDir": "dist",
            "android": { "allowMixedContent": false }
          }
          EOF
          rm -f capacitor.config.ts

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Verify latest features are in built web bundle
        run: |
          grep -R -q "Kasir DBL" dist
          grep -R -q "Pelanggan" dist
          grep -R -q "Bluetooth" dist
          node --check app.js
          node --check db.js

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor plugins and assets
        run: npx cap sync android

      - name: Install native Bluetooth Classic SPP bridge
        run: |
          mkdir -p android/app/src/main/java/id/kasmini/pos
          cp android-native/src/main/java/id/kasmini/pos/*.java android/app/src/main/java/id/kasmini/pos/
          python3 android-native/patch_manifest.py

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: kasir-dbl-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
